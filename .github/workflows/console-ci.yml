name: console

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  local:
    name: Local setup (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app dependencies
        run: npm --prefix apps/console ci
      - name: Syntax
        run: npm run check
      - name: Embedded storage and application tests
        run: npm test
      - name: Fresh clone setup and restart (path with spaces)
        run: npm run test:setup

  postgres:
    name: Shared host (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kaddiya
          POSTGRES_PASSWORD: kaddiya
          POSTGRES_DB: kaddiya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kaddiya -d kaddiya_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://kaddiya:kaddiya@localhost:5432/kaddiya_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app dependencies
        run: npm --prefix apps/console ci
      - name: PostgreSQL isolation and application tests
        run: npm test
